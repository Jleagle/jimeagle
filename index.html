<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jim Eagle</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <!-- Modern Sans-Serif Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000413;
            --text-primary: #f4eeb7;
            --text-secondary: #a0a0a0;
            --accent-color: #ffffff;
            --transition-speed: 1s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            opacity: 0;
            transform: scale(0.98);
            animation: fadeIn var(--transition-speed) ease-out forwards;
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 8rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 2rem;
        }

        nav {
            display: flex;
            gap: 3rem;
            justify-content: center;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P6H9F6VST1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-P6H9F6VST1');
    </script>
</head>
<body>

<div class="container">
    <h1>Jim Eagle</h1>
    <nav>
        <a href="https://github.com/Jleagle">GitHub</a>
        <a href="mailto:jimeagle@gmail.com">Contact</a>
    </nav>
</div>

</body>
</html>
